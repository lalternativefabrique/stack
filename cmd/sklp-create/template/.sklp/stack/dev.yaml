version: 1
kind: devstack
name: dev
env_files:
  - .env
  - .env.local

services:
  # Dependencies are image: services so sklp dev's embedded runc backend pulls
  # them into spacenet (reachable by service name), matching how CI/deploy run.
  # A `run: docker run` service needs a docker binary inside the space and fails
  # there ("docker: not found"); image: is the portable form.
  postgres:
    image: postgres:16-alpine
    network: bridge
    port: 5432
    env:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ready:
      tcp: postgres:5432
      timeout: 30s

  nats:
    image: nats:2.10-alpine
    network: bridge
    port: 4222
    command: ["-js"]
    ready:
      tcp: nats:4222
      timeout: 30s

  core:
    run: go run .
    workdir: apps/core
    port: 4100
    depends_on:
      - postgres
      - nats
    # Reach deps by service name inside spacenet (overrides the localhost URLs
    # in .env, which are for running core straight on the host).
    env:
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      NATS_URL: nats://nats:4222
      # The local urbangate stack (hydra :4444, kratos :4433), started from the
      # urbangate repo with `sklp dev stack`.
      OIDC_ISSUER_URL: http://localhost:4444
      OIDC_AUDIENCE: __APP_NAME__
    ready:
      http: /health
      timeout: 90s

  web:
    # sklp-create only writes the lockfile, and node_modules built on the host
    # would carry host-resolved paths, so the install belongs to the space.
    run: pnpm install --frozen-lockfile && pnpm --filter @app/web dev
    port: 5273
    depends_on:
      - core
    env:
      CORE_URL: http://core:4100
      # Overrides .env's PORT=4100 (core's), which TanStack Start honours over --port.
      PORT: "5273"
      # Sign-in goes through the suite's identity provider even on a laptop:
      # URBANGATE_CLIENT_SECRET and URBANGATE_PROVISIONER_CLIENT_SECRET come
      # from .env, the dev clients of urbangate's ory/hydra/clients-dev.
      URBANGATE_ISSUER_URL: http://localhost:4444
      KRATOS_PUBLIC_URL: http://localhost:4433
    ready:
      # A public screen: the home needs a session, and its guard needs the
      # urbangate secrets, so probing it would fail a stack that is fine.
      http: /sign-in
      # First boot installs the whole workspace before vite starts.
      timeout: 300s
